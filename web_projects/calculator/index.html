<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="calc-wrap">
    <div class="calculator" role="application" aria-label="Calculator">
      <div class="display" id="display" aria-live="polite">0</div>
      <div class="keys">
        <button data-action="clear">C</button>
        <button data-action="posneg">±</button>
        <button data-action="percent">%</button>
        <button data-action="divide">÷</button>

        <button>7</button><button>8</button><button>9</button><button data-action="multiply">×</button>
        <button>4</button><button>5</button><button>6</button><button data-action="subtract">−</button>
        <button>1</button><button>2</button><button>3</button><button data-action="add">+</button>

        <button class="zero">0</button>
        <button data-action="decimal">.</button>
        <button data-action="calculate">=</button>
      </div>
    </div>
  </main>
  <script src="js/calculator.js"></script>
</body>
</html>
